name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up base-image (denoland/deno) security fixes,
    # even when the pinned upstream submodule has not changed.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          # livesync-bridge is a submodule, and it has its own `lib` submodule,
          # so we must check out recursively or the build breaks (COPY . .).
          submodules: recursive

      - name: Resolve upstream pin
        id: pin
        run: echo "sha=$(git -C livesync-bridge rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the repository owner for GHCR.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/livesync-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=upstream-${{ steps.pin.outputs.sha }}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          # Build from the submodule using upstream's own Dockerfile.
          context: ./livesync-bridge
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Report digest
        run: |
          echo "### livesync-bridge image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream pin: \`${{ steps.pin.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin the Kubernetes Deployment to this digest for reproducibility." >> "$GITHUB_STEP_SUMMARY"
